<!DOCTYPE html>
<html lang="{{language}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <title>{{title}} — Twitch Listener</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f7fa;
        --surface: #ffffff;
        --text: #171a1f;
        --muted: #68707d;
        --border: #e2e6ee;
        --accent: #6441a5;
        --accent-soft: #f0ecff;
        --glow: #e9e1fa;
        --shadow: 0 24px 80px -24px rgb(34 23 59 / 16%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101216;
          --surface: #171a1f;
          --text: #f3f5f7;
          --muted: #a2a9b4;
          --border: #2a3038;
          --accent: #b39af3;
          --accent-soft: #2a223c;
          --glow: #241a36;
          --shadow: 0 24px 80px -24px rgb(0 0 0 / 55%);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background:
          radial-gradient(ellipse at 50% 0%, var(--glow), transparent 65%),
          var(--background);
        color: var(--text);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      ::selection {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .card {
        width: min(100%, 560px);
        overflow-wrap: break-word;
        padding: 36px 40px 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.3px;
      }

      .status {
        margin: 0;
        padding: 6px 12px;
        border-radius: 100px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.4;
      }

      .content {
        padding: 52px 0 36px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.5px;
        line-height: 1.6;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 42px);
        font-weight: 650;
        letter-spacing: -1.5px;
        line-height: 1.15;
        text-wrap: balance;
      }

      .description {
        max-width: 38ch;
        margin: 20px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
        text-wrap: pretty;
      }

      .footer {
        margin: 0;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      @media (max-width: 420px) {
        body {
          padding: 24px 16px;
        }

        .card {
          padding: 28px 24px 24px;
          border-radius: 20px;
        }

        .content {
          padding: 40px 0 28px;
        }

        h1 {
          letter-spacing: -1px;
        }

        .description {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="heading">
      <header class="header">
        <span class="brand">Twitch Listener</span>
        <p class="status">{{status}}</p>
      </header>
      <section class="content" aria-labelledby="heading">
        <p class="eyebrow">{{title}}</p>
        <h1 id="heading">{{heading}}</h1>
        <p class="description">{{detail}}</p>
      </section>
      <p class="footer">{{close_hint}}</p>
    </main>
  </body>
</html>
